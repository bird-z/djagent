<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>kgJP · 手机端</title>
<style>
  :root{
    --bg:#0b0d11; --card:#16191f; --card2:#1d212a; --line:#272c36;
    --fg:#eceef2; --dim:#8b929e; --dim2:#5d646f;
    --accent:#4ade80; --accent-bg:#12291c; --accent-line:#2a6641;
    --warn:#fbbf24; --err:#f87171;
    --sb:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    padding:18px 15px calc(24px + var(--sb));
    max-width:600px;margin:0 auto;-webkit-text-size-adjust:100%;
  }

  .top{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
  .logo{font-size:18px;font-weight:700;letter-spacing:.4px}
  .badge{font:600 9px/1 ui-monospace,monospace;color:var(--dim2);
         border:1px solid var(--line);padding:3px 5px;border-radius:4px}
  .tagline{color:var(--dim);font-size:12.5px;margin-bottom:18px}

  .label{font-size:11px;color:var(--dim2);letter-spacing:.6px;
         margin:0 0 8px;font-weight:600}

  .scenes{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .scene{
    padding:9px 14px;border-radius:20px;background:var(--card);
    border:1px solid var(--line);color:var(--dim);
    font-size:13px;cursor:pointer;transition:.15s;user-select:none;
  }
  .scene:active{transform:scale(.96)}
  .scene.on{background:var(--accent-bg);border-color:var(--accent-line);
            color:var(--accent);font-weight:600}

  .brief-row{display:flex;gap:8px;margin-bottom:18px}
  input[type=text]{
    flex:1;padding:11px 13px;border-radius:9px;background:var(--card);
    border:1px solid var(--line);color:var(--fg);font-size:14px;
    font-family:inherit;outline:none;
  }
  input[type=text]:focus{border-color:#3a4250}
  input::placeholder{color:var(--dim2)}
  .go{
    padding:11px 18px;border-radius:9px;border:1px solid var(--accent-line);
    background:var(--accent-bg);color:var(--accent);font-weight:600;
    font-size:14px;font-family:inherit;cursor:pointer;flex:none;
  }
  .go:active{transform:scale(.97)}
  .go:disabled{opacity:.45;transform:none}

  .result{min-height:100px}
  .empty{
    border:1px dashed var(--line);border-radius:12px;padding:22px 16px;
    text-align:center;color:var(--dim2);font-size:13px;line-height:1.7;
  }
  .err-box{
    border:1px solid #4a2222;background:#1c1214;border-radius:12px;
    padding:14px;color:var(--err);font-size:13px;line-height:1.6;
  }

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px;margin-bottom:11px;animation:in .22s ease-out;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .reason{
    font-size:13px;color:var(--warn);line-height:1.6;margin-bottom:12px;
    padding-left:10px;border-left:2px solid #4a3a15;
  }
  .song-row{display:flex;align-items:center;gap:11px;margin-bottom:13px}
  .cover{
    width:46px;height:46px;border-radius:8px;flex:none;
    background:linear-gradient(135deg,#2a3140,#1a1e26);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;color:#3f4756;
  }
  .meta{min-width:0;flex:1}
  .sname{font-size:15.5px;font-weight:600;white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis}
  .sartist{font-size:12.5px;color:var(--dim);margin-top:1px}
  .btns{display:flex;gap:8px}
  .btn{
    flex:1;padding:12px;border-radius:9px;text-align:center;
    text-decoration:none;font-size:14px;font-weight:600;
    border:1px solid var(--line);background:var(--card2);color:var(--fg);
    display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .btn:active{transform:scale(.975)}
  .btn.play{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent)}
  .btn.web{flex:0 0 auto;padding:12px 15px;color:var(--dim)}
  .hint{font-size:10.5px;color:var(--dim2);margin-top:9px;line-height:1.5}

  .foot{margin-top:22px;display:flex;gap:8px}
  .mini{
    flex:1;padding:10px;border-radius:8px;background:transparent;
    border:1px solid var(--line);color:var(--dim2);
    font-size:12px;cursor:pointer;font-family:inherit;
  }
  .mini:active{background:var(--card)}

  .logbox{
    margin-top:12px;background:#0a0c10;border:1px solid var(--line);
    border-radius:10px;padding:11px 12px;
    font:11px/1.7 ui-monospace,Menlo,monospace;color:var(--dim2);
    max-height:200px;overflow-y:auto;white-space:pre-wrap;
    word-break:break-all;display:none;
  }
  .logbox.show{display:block}
  .logbox .ok{color:var(--accent)}
  .logbox .err{color:var(--err)}
  .logbox .hl{color:#7dd3fc}
  .spinner{
    display:inline-block;width:14px;height:14px;border:2px solid #2a3140;
    border-top-color:var(--accent);border-radius:50%;
    animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="top">
  <span class="logo">kgJP</span>
  <span class="badge">phone</span>
</div>
<div class="tagline">选个状态，给你一首，点开就在酷狗里听</div>

<p class="label">现在什么状态</p>
<div class="scenes" id="scenes"></div>

<div class="brief-row">
  <input type="text" id="brief" placeholder="补充一句（会写进推荐理由）">
  <button class="go" id="go">要歌</button>
</div>

<div class="result" id="result">
  <div class="empty">选一个状态，然后点「要歌」</div>
</div>

<div class="foot">
  <button class="mini" id="toggle-log">诊断日志</button>
  <button class="mini" id="test-all">全部测一遍</button>
</div>
<div class="logbox" id="logbox"></div>

<script>
const logEl = document.getElementById("logbox");
let current = null;

/* 云端部署会用 ?sharecode= 做访问校验。
   必须把它透传到每一个 API 请求，否则网关直接 403，
   页面能打开但一条数据都拿不到。 */
const SC = new URLSearchParams(location.search).get("sharecode");
function api(path){
  const sep = path.includes("?") ? "&" : "?";
  return SC ? path + sep + "sharecode=" + encodeURIComponent(SC) : path;
}

function log(msg, cls){
  const t = new Date().toTimeString().slice(0,8);
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = "[" + t + "] " + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}

/* ── 场景 ── */
async function loadScenes(){
  try{
    const r = await fetch(api("/api/scenes"));
    const d = await r.json();
    const box = document.getElementById("scenes");
    box.innerHTML = "";
    d.scenes.forEach(s => {
      const b = document.createElement("div");
      b.className = "scene";
      b.dataset.id = s.id;
      b.textContent = s.label;
      b.onclick = () => {
        [...box.children].forEach(c => c.classList.toggle("on", c === b));
        current = s.id;
        log("选中 " + s.id);
      };
      box.appendChild(b);
    });
    log("场景 " + d.scenes.length + " 个已加载", "ok");
  }catch(e){
    log("场景加载失败: " + e.message, "err");
  }
}

/* ── 要歌 ── */
const resultEl = document.getElementById("result");

async function ask(){
  if (!current){ 
    resultEl.innerHTML = '<div class="err-box">先选一个状态</div>';
    return;
  }
  const brief = document.getElementById("brief").value.trim();
  const btn = document.getElementById("go");
  btn.disabled = true;
  resultEl.innerHTML = '<div class="empty"><span class="spinner"></span>正在选歌…</div>';
  log("请求 /api/recommend scene=" + current + " brief=" + (brief || "(空)"));

  try{
    const u = "/api/recommend?scene=" + encodeURIComponent(current) +
              "&brief=" + encodeURIComponent(brief) + "&platform=android";
    const r = await fetch(api(u));
    const d = await r.json();
    if (!d.found){
      resultEl.innerHTML = '<div class="err-box">' +
        (d.message || "没有合适的歌") + '</div>';
      log("未找到: " + (d.message || ""), "err");
      return;
    }
    render(d);
    log("推荐 → " + d.title + " / " + d.artist, "ok");
  }catch(e){
    resultEl.innerHTML = '<div class="err-box">请求失败：' + e.message + '</div>';
    log("请求异常: " + e.message, "err");
  }finally{
    btn.disabled = false;
  }
}

function render(d){
  resultEl.innerHTML = "";
  const c = document.createElement("div");
  c.className = "card";

  const r = document.createElement("div");
  r.className = "reason";
  r.textContent = d.reason;
  c.appendChild(r);

  const row = document.createElement("div");
  row.className = "song-row";
  row.innerHTML =
    '<div class="cover">♪</div>' +
    '<div class="meta">' +
      '<div class="sname"></div>' +
      '<div class="sartist"></div>' +
    '</div>';
  row.querySelector(".sname").textContent = d.title;
  row.querySelector(".sartist").textContent = d.artist + " · " + d.duration_text;
  c.appendChild(row);

  const btns = document.createElement("div");
  btns.className = "btns";

  const a = document.createElement("a");
  a.className = "btn play";
  a.href = d.links.scheme;
  a.textContent = "▶ 在酷狗播放";
  a.onclick = () => log("点击 scheme");
  btns.appendChild(a);

  const b2 = document.createElement("a");
  b2.className = "btn web";
  b2.href = d.links.web;
  b2.textContent = "网页";
  b2.onclick = () => log("点击 web: " + d.links.web);
  btns.appendChild(b2);

  c.appendChild(btns);

  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = d.verified
    ? "这首歌已在真机验证过唤起"
    : "唤起协议尚未真机验证：若酷狗只打开不播放，请点「网页」";
  c.appendChild(hint);

  resultEl.appendChild(c);
}

/* ── 诊断 ── */
document.getElementById("toggle-log").onclick = () => {
  logEl.classList.toggle("show");
  document.getElementById("toggle-log").textContent =
    logEl.classList.contains("show") ? "隐藏日志" : "诊断日志";
};

document.getElementById("test-all").onclick = async () => {
  logEl.classList.add("show");
  log("=== 环境 ===", "hl");
  log("UA: " + navigator.userAgent);
  log("页面: " + location.href);

  try{
    const s = await (await fetch(api("/api/stats"))).json();
    log("服务端曲库 " + s.total + " 首 / 场景 " + s.scenes + " 个 / 已验证 " + s.verified, "ok");
  }catch(e){
    log("服务端不可达: " + e.message, "err");
  }

  log("");
  log("=== 逐场景实测 ===", "hl");
  const d = await (await fetch(api("/api/scenes"))).json();
  for (const sc of d.scenes){
    try{
      const r = await fetch(api("/api/recommend?scene=" + sc.id +
                            "&brief=" + encodeURIComponent("测试") + "&platform=android"));
      const t = await r.json();
      if (t.found){
        log("[" + sc.id + "] " + t.title + " / " + t.artist, "ok");
        log("   scheme 长度 " + t.links.scheme.length);
        log("   web: " + t.links.web);
      }else{
        log("[" + sc.id + "] 无匹配: " + t.message, "err");
      }
    }catch(e){
      log("[" + sc.id + "] 失败: " + e.message, "err");
    }
  }

  log("");
  log("=== 手动验证 ===", "hl");
  log("1. 点「在酷狗播放」→ 应唤起酷狗");
  log("2. 若停在首页 → 协议未解析参数");
  log("3. 若无反应 → 换 Chrome 打开本页重试");
  log("4. 点「网页」→ 应看到酷狗页面");
  log("把这段截图发回");
};

document.getElementById("go").onclick = ask;
document.getElementById("brief").addEventListener("keydown", e => {
  if (e.key === "Enter") ask();
});

/* 启动 */
log("kgJP 手机端已加载", "ok");
loadScenes();
</script>
</body>
</html>
